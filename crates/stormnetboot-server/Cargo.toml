[package]
name = "stormnetboot-server"
description = "Network boot asset service: serves the boot chain over HTTP from signed pallets"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The BootHost source. Optional so an appliance that has no cluster — a
# bootstrap, or an air-gapped site running off hosts.json — can build a server
# without an API client in it at all.
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[features]
default = ["kubernetes"]
kubernetes = ["dep:chrono", "dep:futures", "dep:k8s-openapi", "dep:kube", "dep:schemars"]
